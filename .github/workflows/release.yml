name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = ${env:GITHUB_REF}.Replace('refs/tags/', '')
          $version = $tag.TrimStart('v')
          Write-Output "Tag: $tag  ->  Version: $version"
          python -c "
          import re, pathlib
          p = pathlib.Path('playcache/__init__.py')
          text = p.read_text(encoding='utf-8')
          new = re.sub(r'__version__\s*=\s*[\x22\x27].*?[\x22\x27]', '__version__ = \x22$version\x22', text)
          p.write_text(new, encoding='utf-8')
          "
          Get-Content playcache/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable bundle
        run: pyinstaller playcache.spec --noconfirm

      - name: Create zip archive
        run: |
          $tag = ${env:GITHUB_REF}.Replace('refs/tags/', '')
          Compress-Archive -Path dist/PlayCache/* -DestinationPath "PlayCache-$tag-windows-portable.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCache-windows-portable
          path: "PlayCache-*-windows-portable.zip"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF##*/}
          VERSION=${TAG#v}
          echo "Tag: $TAG  ->  Version: $VERSION"
          python -c "
          import re, pathlib
          p = pathlib.Path('playcache/__init__.py')
          text = p.read_text(encoding='utf-8')
          new = re.sub(r'__version__\s*=\s*[\"\x27].*?[\"\x27]', '__version__ = \"$VERSION\"', text)
          p.write_text(new, encoding='utf-8')
          "
          cat playcache/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable bundle
        run: pyinstaller playcache.spec --noconfirm

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/PlayCache/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp playcache/assets/app.png AppDir/usr/share/icons/hicolor/256x256/apps/playcache.png
          mkdir -p AppDir/usr/share/applications

      - name: Create .desktop file
        run: |
          cat > AppDir/playcache.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=PlayCache
          Comment=Game library cataloguer
          Exec=PlayCache
          Icon=playcache
          Categories=Game;Utility;
          Terminal=false
          StartupNotify=true
          EOF

      - name: Build AppImage
        run: |
          export ARCH=x86_64
          export OUTPUT=PlayCache-${GITHUB_REF##*/}-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage \
            --desktop-file AppDir/playcache.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/playcache.png
          # Move the AppImage out of the working dir so the build tools
          # don't get picked up by the artifact upload.
          mkdir -p appimage-out
          mv PlayCache-*.AppImage appimage-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCache-linux-appimage
          path: "appimage-out/*.AppImage"

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/PlayCache-windows-portable/*.zip
            artifacts/PlayCache-linux-appimage/*.AppImage
