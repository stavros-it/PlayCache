name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable bundle
        run: pyinstaller playcache.spec --noconfirm

      - name: Create zip archive
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          Compress-Archive -Path dist/PlayCache/* -DestinationPath "PlayCache-$tag-windows-portable.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCache-windows-portable
          path: "PlayCache-*-windows-portable.zip"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable bundle
        run: pyinstaller playcache.spec --noconfirm

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/PlayCache/* AppDir/usr/bin/
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp playcache/assets/app.png AppDir/usr/share/icons/hicolor/256x256/apps/playcache.png
          mkdir -p AppDir/usr/share/applications

      - name: Create .desktop file
        run: |
          cat > AppDir/playcache.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=PlayCache
          Comment=Game library cataloguer
          Exec=PlayCache
          Icon=playcache
          Categories=Game;Utility;
          Terminal=false
          StartupNotify=true
          EOF

      - name: Build AppImage
        run: |
          export ARCH=x86_64
          export OUTPUT=PlayCache-${GITHUB_REF##*/}-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage \
            --desktop-file AppDir/playcache.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/playcache.png
          ls -la *.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCache-linux-appimage
          path: "*.AppImage"

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/PlayCache-windows-portable/*.zip
            artifacts/PlayCache-linux-appimage/*.AppImage
