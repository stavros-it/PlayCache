name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Headless Qt — no display server required on CI
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # libegl1 + libgl1: needed by PySide6 QtGui (QPainter/QPixmap) in
          # offscreen mode — without them importing QtGui raises ImportError.
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check playcache/ tests/ run.py run.pyw scripts/

      - name: Test (pytest)
        run: python -m pytest tests/ -q
