[rawg]
# Fallback + merge source. Get a FREE key at https://rawg.io/apiauth
# (optional but recommended — fills rating, Metacritic, cover, website)
api_key =

[thegamesdb]
# Primary data source. Get a FREE key at https://api.thegamesdb.net/login
# (1000 requests/month; status bar shows remaining quota)
api_key =

[catalog]
# SQLite database file path (relative to working dir or absolute)
db_path = game_library.db

# Seconds to wait between API requests (be nice to free APIs)
request_delay = 0.3

# Per-request timeout in seconds
request_timeout = 20

# Max retries on 429/5xx (exponential backoff)
max_retries = 3

# Fuzzy match threshold 0-100; higher = stricter matching
fuzzy_threshold = 60

# Max chars for SHORT DESCRIPTION
description_max_chars = 320

# Skip these folder names when scanning a drive root
skip_folders = Windows, Program Files, Program Files (x86), ProgramData, Users, $Recycle.Bin, System Volume Information, $WinREAgent, $SysReset, $WINDOWS.~BT, Recovery, PerfLogs, Intel, AMD, NVIDIA
