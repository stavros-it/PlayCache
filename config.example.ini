[rawg]
# Primary metadata source. Get a FREE key at https://rawg.io/
# (requires a free account registration; 20,000 requests/month)
api_key =

[thegamesdb]
# Fallback + merge source. Get a FREE key at https://thegamesdb.net/
# (requires a free account registration; 1000 requests/month;
#  status bar shows remaining quota)
api_key =

[catalog]
# SQLite database file path (relative to working dir or absolute)
db_path = game_library.db

# Seconds to wait between API requests (be nice to free APIs)
request_delay = 0.3

# Per-request timeout in seconds
request_timeout = 20

# Max retries on 429/5xx (exponential backoff)
max_retries = 3

# Fuzzy match threshold 0-100; higher = stricter matching
fuzzy_threshold = 60

# Max chars for SHORT DESCRIPTION
description_max_chars = 320

# Skip these folder names when scanning a drive root.
# Defaults cover both Windows and Linux system folders; edit as needed.
skip_folders = Windows, Program Files, Program Files (x86), ProgramData, Users, $Recycle.Bin, System Volume Information, $WinREAgent, $SysReset, $WINDOWS.~BT, Recovery, PerfLogs, Intel, AMD, NVIDIA, boot, bin, sbin, etc, var, usr, lib, lib64, sys, proc, dev, run, srv, snap, lost+found
