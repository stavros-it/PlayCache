[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playcache"
dynamic = ["version"]
description = "Desktop GUI that scans installed game folders and catalogues them with metadata from TheGamesDB and RAWG."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Stavros Antoniou" },
]
copyright = "Copyright (c) 2026 Stavros Antoniou. All rights reserved."
keywords = ["games", "catalog", "metadata", "thegamesdb", "rawg", "pyside6", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Database",
    "License :: Other/Proprietary License",
]
dependencies = [
    "requests>=2.28",
    "openpyxl>=3.0",
    "PySide6>=6.5",
]

[project.urls]
"Homepage" = "https://github.com/StavrosAntoniou/PlayCache"
"Repository" = "https://github.com/StavrosAntoniou/PlayCache"
"Issues" = "https://github.com/StavrosAntoniou/PlayCache/issues"

[tool.setuptools.packages.find]
include = ["playcache*"]

# Single source of truth: version lives in playcache/__init__.py
[tool.setuptools.dynamic]
version = {attr = "playcache.__version__"}

[tool.setuptools.package-data]
playcache = ["assets/*.ico", "assets/*.png"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# Enable rule families:
#   E    pycodestyle errors
#   W    pycodestyle warnings
#   F    pyflakes (unused imports, undefined names, etc.)
#   I    isort (import ordering)
#   B    bugbear (common Python pitfalls)
#   UP   pyupgrade (modernize syntax)
#   SIM  simplify (e.g. unnecessary else after return)
#   N    pep8-naming
#   C4   comprehensions
#   DTZ  datetime (avoid naive datetimes)
#   TRY  exception handling
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "DTZ", "TRY"]
ignore = [
    "E501",   # line too long — we use ruff format, not manual wrapping
    "B008",   # function call in default arg — used intentionally for Qt slots
    "B007",   # unused loop control variable — keep names for readability in tuple unpacking
    "B011",   # assert False — used in tests for unreachable branches
    "B904",   # raise from — we handle this case-by-case
    "C416",   # unnecessary comprehension — explicit dict comprehension is clearer
    "N802",   # function name should be lowercase — clashes with Qt PascalCase slots
    "N803",   # argument name should be lowercase — clashes with Qt PascalCase
    "N805",   # first arg of method should be self — clashes with self_inner in nested QThread
    "N806",   # variable in function should be lowercase — clashes with Qt constants
    "N815",   # mixed case variable in class scope — clashes with Qt signal names (fieldEdited)
    "N818",   # exception suffix — our Error suffix is fine
    "SIM105", # use contextlib.suppress — try/except/pass is more explicit
    "SIM300", # yoda conditions — harmless and sometimes clearer
    "TRY003", # long messages in exception classes — fine for our user-facing errors
    "TRY300", # move statement to else block — would require restructuring
    "TRY301", # abstract raise to inner function — intentional cancellation check
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "DTZ001",  # tz in datetime — fine in tests
    "B017",    # assertRaises(Exception) — fine in tests
    "TRY002",  # raise Exception — fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["playcache"]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
]
filterwarnings = [
    "error",
    # Qt deprecation warnings flood the output and aren't actionable here
    "ignore::DeprecationWarning:PySide6.*",
    "ignore::PendingDeprecationWarning",
]
